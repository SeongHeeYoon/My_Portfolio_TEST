<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<!-- iOS Safari: 노치 대응(viewport-fit=cover) + 확대 허용 -->
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="format-detection" content="telephone=no">
<meta name="theme-color" content="#faf9f8">
<meta name="description" content="윤희성 · 게임 기획자 — 이력서 / 자기소개서 / 포트폴리오">
<title>윤희성 · 게임 기획자</title>

<style>
/* ===========================================================================
   FONT — 바탕화면의 Pretendard-Regular 사용
   1순위: CDN(woff2, 용량 작고 iOS·안드로이드 모두 확실)
   2순위: 같은 폴더의 fonts/Pretendard-Regular.otf  (인터넷이 없을 때)
   =========================================================================== */
@font-face{
  font-family:'Pretendard'; font-style:normal; font-weight:400; font-display:swap;
  src:url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/woff2/Pretendard-Regular.woff2') format('woff2'),
      url('./fonts/Pretendard-Regular.woff2') format('woff2'),
      url('./fonts/Pretendard-Regular.otf') format('opentype');
}
/* 중간 굵기(500). 로컬에는 Medium 파일이 없어 CDN 이 막히면 Regular 로 보입니다.
   더 확실하게 하려면 Pretendard-Medium 파일을 fonts 폴더에 넣고 아래 경로를 추가하세요. */
@font-face{
  font-family:'Pretendard'; font-style:normal; font-weight:500; font-display:swap;
  src:url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/woff2/Pretendard-Medium.woff2') format('woff2'),
      url('./fonts/Pretendard-Regular.woff2') format('woff2'),
      url('./fonts/Pretendard-Regular.otf') format('opentype');
}
/* 굵은 글씨(700). 반드시 Bold 파일을 가리켜야 합니다.
   여기를 Regular 로 두면 브라우저가 '이게 볼드'라고 믿어 굵게 보이지 않습니다. */
@font-face{
  font-family:'Pretendard'; font-style:normal; font-weight:700; font-display:swap;
  src:url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/woff2/Pretendard-Bold.woff2') format('woff2'),
      url('./fonts/Pretendard-Bold.woff2') format('woff2'),
      url('./fonts/Pretendard-Bold.otf') format('opentype');
}

/* ===========================================================================
   DESIGN TOKENS — Sprig (warm editorial, near-monochrome)
   =========================================================================== */
:root{
  /* --- 동물의 숲 느낌의 따뜻한 마을 팔레트 --- */
  --abyssal:#61574a;   /* 본문 글자 — 따뜻한 갈색 */
  --obsidian:#524839;  /* 제목 */
  --slate:#8b8171;     /* 보조 글자 */
  --graphite:#a29887;  /* 라벨 */
  --fog:#b8b0a2;
  --pebble:#cdc5b8;

  --bone:#fffdfa;      /* 패널(카드) 바탕 — 크림색 */
  --ash:#faf7f1;       /* 한 단계 진한 크림 */
  --mist:#e8e2d7;      /* 테두리 */
  --vapor:#ded8cd;     /* 옅은 테두리 */

  --canvas:#f6f2ea;    /* 페이지 바탕 — 모래빛 */
  --leaf:#d98b5f;      /* 주요 강조색 — 따뜻한 테라코타 (주요 버튼/활성 탭) */
  --leaf-dark:#b56f42; /* 테라코타 그림자 */
  --wood:#9c8a79;      /* 나무 안내판 */
  --wood-dark:#877565;
  --peach:#d5a684;     /* 강조 주황 */
  --shadow:rgba(160,150,135,.20);   /* 스티커 그림자 */

  --espresso:#d98b5f;  /* (기존 이름 유지) 채움 버튼 = 테라코타 */
  --coffee:#9c8a79;    /* (기존 이름 유지) 나무색 */
  --carbon:#000000;

  --dusk:#efdcb6;     --ember:#eba370; --twilight:#7d7a8f;
  --gradient-warm:linear-gradient(150deg, #f2ead9 0%, #e6cdba 48%, #cdc6cf 100%);

  --font:'Pretendard', -apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo',
         'Malgun Gothic', system-ui, sans-serif;

  --sp-8:8px;   --sp-16:16px; --sp-24:24px; --sp-32:32px; --sp-40:40px;
  --sp-48:48px; --sp-64:64px; --sp-80:80px; --sp-96:96px;

  --max:1080px;
  --r-pill:999px; --r-card:28px; --r-badge:999px; --r-hero:40px;

  --pad-x:32px;             /* 좌우 여백 (모바일에서 줄어듭니다) */
  --section-gap:32px;
}

/* ===========================================================================
   RESET  (iOS Safari 대응 포함)
   =========================================================================== */
*,*::before,*::after{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
html{
  -webkit-text-size-adjust:100%;            /* 가로↔세로 회전 시 글자 크기 튐 방지 */
  text-size-adjust:100%;
  scroll-behavior:smooth;
}
body{
  margin:0;
  background:var(--bone);
  color:var(--abyssal);
  font-family:var(--font);
  font-size:16px; font-weight:400; line-height:1.5;
  -webkit-font-smoothing:antialiased; -moz-osx-font-smoothing:grayscale;
  word-break:keep-all;          /* 한국어 단어가 중간에서 잘리지 않도록 */
  overflow-wrap:break-word;     /* 단, 긴 영문·URL 은 줄바꿈 허용 */
  overflow-x:hidden;
  overscroll-behavior-y:none;   /* iOS 바운스 과다 방지 */
  /* 노치/홈바 안전영역 */
  padding-left:env(safe-area-inset-left);
  padding-right:env(safe-area-inset-right);
}
img{max-width:100%; display:block; border:0;}
a{color:inherit; text-decoration:none;}
button{font:inherit; color:inherit; background:none; border:0; cursor:pointer;}
input{font:inherit;}
ul,ol{margin:0; padding:0; list-style:none;}
h1,h2,h3,h4,p{margin:0;}
::selection{background:#eae4d4; color:var(--obsidian);}
/* 키보드로 이동할 때만 보이는 초점 표시 */
:focus{outline:none;}
:focus-visible{outline:2px solid var(--abyssal); outline-offset:3px; border-radius:4px;}

/* ===========================================================================
   LAYOUT
   =========================================================================== */
.wrap{max-width:var(--max); margin:0 auto; padding-left:var(--pad-x); padding-right:var(--pad-x);}

/* ---------- 섹션 공통 ---------- */
.page{padding-top:var(--sp-64); padding-bottom:var(--sp-96);}
.page[hidden]{display:none !important;}

.section{padding-top:var(--section-gap);}
.section + .section{border-top:1px solid var(--mist); margin-top:var(--section-gap); padding-top:var(--section-gap);}

.eyebrow{
  font-size:13px; color:var(--graphite); letter-spacing:.08em; text-transform:uppercase;
  margin-bottom:12px;
}
.h-section{font-size:32px; font-weight:500; line-height:1.2; letter-spacing:-.02em;}
.lede{margin-top:var(--sp-16); color:var(--slate); font-size:16px; line-height:1.7; max-width:62ch;}

/* ===========================================================================
   MAIN — 메인 화면
   =========================================================================== */
/* data.js 의 줄바꿈은 넓은 화면에서만 쓰고, 좁은 화면에서는 자연스럽게 이어 붙입니다 */
.ln{display:block;}
@media (max-width:640px){
  .ln{display:inline;}
  .ln + .ln::before{content:" ";}
}

/* ---------- Work Step ---------- */
.steps{display:grid; grid-template-columns:repeat(4,1fr); gap:var(--sp-16); margin-top:var(--sp-40);}
.step{
  background:var(--ash); border-radius:var(--r-card);
  padding:var(--sp-32) var(--sp-24); display:flex; flex-direction:column;
}
.step__no{font-size:13px; color:var(--graphite); letter-spacing:.1em;}
.step__title{margin-top:14px; font-size:18px; font-weight:500; letter-spacing:-.01em; line-height:1.35;}
.step__desc{margin-top:10px; font-size:14px; line-height:1.65; color:var(--slate);}

/* ---------- Game Tournament ---------- */
.tour{margin-top:var(--sp-40); border-top:1px solid var(--mist);}
.tour__row{
  display:grid; grid-template-columns:170px 1fr auto; gap:var(--sp-16);
  align-items:baseline; padding:20px 0; border-bottom:1px solid var(--mist);
}
.tour__row:last-child{border-bottom:0;}
.tour__period{color:var(--graphite); font-size:15px;}
.tour__title{font-size:17px; font-weight:500; letter-spacing:-.01em;}
.tour__result{font-size:15px; color:var(--abyssal); text-align:right; white-space:nowrap;}

/* ---------- Project (메인) ---------- */
.mproj{display:grid; grid-template-columns:repeat(2,1fr); gap:var(--sp-24); margin-top:var(--sp-40);}
.mproj__card{
  border:1px solid var(--mist); border-radius:var(--r-card);
  padding:var(--sp-48) var(--sp-40);
}
.mproj__title{font-size:28px; font-weight:500; letter-spacing:-.02em;}
.mproj__desc{margin-top:12px; font-size:16px; line-height:1.6; color:var(--slate);}

/* ---------- BADGE ---------- */
.badge{
  display:inline-block; padding:6px 12px; border-radius:var(--r-badge);
  background:var(--ash); color:var(--abyssal); font-size:14px; line-height:1.3;
}
.badge--line{background:transparent; border:1px solid var(--vapor); color:var(--slate);}

/* ---------- HERO (이력서) ---------- */
.hero{display:grid; grid-template-columns:300px 1fr; gap:var(--sp-48); align-items:center;}
.photo{
  position:relative; aspect-ratio:3/4; border-radius:var(--r-hero); overflow:hidden;
  background:var(--gradient-warm);
}
/* 구형 iOS Safari(15 미만)용 비율 대체 */
@supports not (aspect-ratio:1/1){
  .photo{height:0; padding-bottom:133.33%;}
  .pf__cover{height:0; padding-bottom:75%;}
}
/* 사진은 항상 안내문 위에 올라오도록 */
.photo img{
  position:absolute; top:0; left:0; right:0; bottom:0;
  width:100%; height:100%; object-fit:cover; z-index:2;
}
.photo__ph{
  position:absolute; top:0; left:0; right:0; bottom:0; z-index:1;
  display:flex; flex-direction:column;
  align-items:center; justify-content:center; gap:6px; text-align:center; padding:24px;
  color:var(--bone);
}
.photo__ph b{font-size:44px; font-weight:500; letter-spacing:.02em;}
.photo__ph span{font-size:13px; opacity:.9; line-height:1.5;}

.hero__name{font-size:14px; color:var(--graphite); margin-bottom:var(--sp-16); letter-spacing:.06em;}
.hero__tagline{font-size:36px; font-weight:500; line-height:1.32; letter-spacing:-.025em;}
.keys{display:flex; flex-wrap:wrap; gap:8px; margin-top:var(--sp-32);}

/* ---------- 정보 리스트 ---------- */
.rows{margin-top:var(--sp-32); border-top:1px solid var(--mist);}
.row{
  display:grid; grid-template-columns:160px 1fr; gap:var(--sp-16);
  padding:18px 0; border-bottom:1px solid var(--mist);
}
.row dt{color:var(--graphite); font-size:15px;}
.row dd{margin:0; font-size:16px; word-break:break-word;}
.row dd a{border-bottom:1px solid var(--vapor); padding-bottom:1px;}
/* 섹션 사이 구분선과 겹치지 않도록 마지막 줄의 밑선은 제거 */
.row:last-child, .tl__item:last-child, .cert:last-child, .essay__item:last-child{border-bottom:0;}

/* ---------- 학력 · 경력 ---------- */
.group + .group{margin-top:var(--sp-48);}
.group__title{font-size:15px; color:var(--graphite); margin-bottom:var(--sp-16); letter-spacing:.04em;}
.tl{border-top:1px solid var(--mist);}
.tl__item{
  display:grid; grid-template-columns:200px 1fr; gap:var(--sp-16);
  padding:20px 0; border-bottom:1px solid var(--mist);
}
.tl__period{color:var(--graphite); font-size:15px; white-space:nowrap;}
.tl__title{font-size:17px; font-weight:500; letter-spacing:-.01em;}
.tl__desc{margin-top:6px; color:var(--slate); font-size:15px; line-height:1.6;}

/* ---------- 프로젝트 카드 ---------- */
.cards{display:grid; grid-template-columns:repeat(2,1fr); gap:var(--sp-24); margin-top:var(--sp-40);}
.card{
  background:var(--ash); border-radius:var(--r-card); padding:var(--sp-40);
  display:flex; flex-direction:column;
}
.card__no{font-size:13px; color:var(--graphite); letter-spacing:.08em;}
.card__title{margin-top:10px; font-size:24px; font-weight:500; letter-spacing:-.02em;}
.card__summary{margin-top:10px; color:var(--slate); font-size:15px; line-height:1.6;}
.card__tags{display:flex; flex-wrap:wrap; gap:6px; margin-top:var(--sp-16);}
.card__tags .badge{background:var(--bone); font-size:13px; padding:5px 10px;}
.card__points{margin-top:var(--sp-24); padding-top:var(--sp-24); border-top:1px solid var(--vapor);}
.card__points li{
  position:relative; padding-left:16px; font-size:15px; line-height:1.65; color:var(--abyssal);
}
.card__points li + li{margin-top:8px;}
.card__points li::before{
  content:""; position:absolute; left:0; top:.62em;
  width:5px; height:5px; border-radius:50%; background:var(--pebble);
}

/* ---------- 자격증 ---------- */
.cert{display:grid; grid-template-columns:140px 1fr auto; gap:var(--sp-16); padding:18px 0; border-bottom:1px solid var(--mist);}
.cert__date{color:var(--graphite); font-size:15px;}
.cert__name{font-size:16px;}
.cert__issuer{color:var(--slate); font-size:15px; text-align:right;}

/* ---------- 기타사항 ---------- */
.extras{display:grid; grid-template-columns:repeat(2,1fr); gap:var(--sp-24); margin-top:var(--sp-40);}
.extra{border:1px solid var(--mist); border-radius:var(--r-card); padding:var(--sp-40);}
.extra__title{font-size:18px; font-weight:500; margin-bottom:var(--sp-16);}
.extra li{position:relative; padding-left:16px; font-size:15px; line-height:1.7; color:var(--slate);}
.extra li::before{content:""; position:absolute; left:0; top:.72em; width:5px; height:5px; border-radius:50%; background:var(--pebble);}

/* ---------- 자기소개서 ---------- */
.essay{border-top:1px solid var(--mist);}
/* 소제목이 위, 내용이 아래로 오는 세로 구성 */
.essay__item{display:block; padding:var(--sp-48) 0; border-bottom:1px solid var(--mist);}
.essay__head{margin-bottom:var(--sp-24);}
.essay__no{font-size:14px; color:var(--graphite); letter-spacing:.1em; margin-bottom:12px;}
.essay__title{font-size:34px; font-weight:700; line-height:1.3; letter-spacing:-.025em;}
.essay__body p{font-size:16px; line-height:1.9; color:var(--abyssal); max-width:70ch;}
.essay__body p + p{margin-top:var(--sp-24);}

/* 꼭 읽었으면 하는 문장 — 굵게 + 연한 형광펜 */
.essay__body .hl{
  font-weight:700; color:var(--obsidian);
  background:linear-gradient(transparent 58%, rgba(230,164,110,.42) 58%);
  padding:0 2px; border-radius:2px;
}

/* ---------- 포트폴리오 ---------- */
.pf{display:grid; grid-template-columns:repeat(2,1fr); gap:var(--sp-24); margin-top:var(--sp-40);}
.pf__card{border-radius:var(--r-card); overflow:hidden; background:var(--ash); display:flex; flex-direction:column;}
.pf__cover{position:relative; aspect-ratio:4/3; background:var(--gradient-warm);}
.pf__cover img{position:absolute; top:0; left:0; width:100%; height:100%; object-fit:cover;}
.pf__body{padding:var(--sp-32); display:flex; flex-direction:column; flex:1;}
.pf__title{font-size:22px; font-weight:500; letter-spacing:-.02em;}
.pf__summary{margin-top:10px; color:var(--slate); font-size:15px; line-height:1.6;}
.pf__tags{display:flex; flex-wrap:wrap; gap:6px; margin-top:14px;}
.pf__tags .badge{background:var(--bone); font-size:13px; padding:5px 10px;}
.pf__foot{margin-top:auto; padding-top:var(--sp-24);}

.empty{
  margin-top:var(--sp-40); border:1px dashed var(--vapor); border-radius:var(--r-card);
  padding:var(--sp-64) var(--sp-40); text-align:left; color:var(--graphite);
}
.empty b{display:block; font-size:18px; font-weight:500; color:var(--abyssal); margin-bottom:10px;}
.empty code{
  font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; font-size:13px;
  background:var(--ash); padding:2px 6px; border-radius:var(--r-badge); color:var(--abyssal);
}

/* ---------- 버튼 ---------- */
.btn{
  display:inline-flex; align-items:center; justify-content:center; gap:8px;
  padding:11px 22px; border-radius:var(--r-pill);
  font-size:15px; line-height:1; white-space:nowrap;
  transition:opacity .18s ease, background .18s ease;
}
.btn--fill{background:var(--espresso); color:var(--bone);}
.btn--ghost{border:1px solid var(--vapor); color:var(--abyssal);}
.btn--onDark{border:1px solid rgba(250,249,248,.4); color:var(--bone);}
.btn:active{opacity:.75;}

/* ---------- 하단 연락 배너 ---------- */
.cta{
  margin-top:var(--section-gap);
  background:var(--espresso); color:var(--bone);
  border-radius:var(--r-hero); padding:var(--sp-80) var(--sp-64);
}
.cta__heading{font-size:34px; font-weight:500; line-height:1.32; letter-spacing:-.025em;}
.cta__btns{display:flex; flex-wrap:wrap; gap:10px; margin-top:var(--sp-40);}
.cta .btn--fill{background:var(--bone); color:var(--espresso);}

/* ===========================================================================
   수정 기능 — 로그인 창 / 편집 모드 / 하단 도구막대
   =========================================================================== */
.modal{
  position:fixed; top:0; left:0; right:0; bottom:0; z-index:100;
  display:flex; align-items:center; justify-content:center; padding:24px;
  background:rgba(20,19,18,.44);
  -webkit-backdrop-filter:blur(8px); backdrop-filter:blur(8px);
}
.modal[hidden]{display:none !important;}
.modal__box{
  width:100%; max-width:390px; background:var(--bone);
  border-radius:32px; padding:var(--sp-40) var(--sp-32);
}
.modal__title{font-size:22px; font-weight:500; letter-spacing:-.02em;}
.modal__note{margin-top:10px; font-size:13px; line-height:1.6; color:var(--graphite);}
.field{margin-top:var(--sp-24);}
.field label{display:block; font-size:13px; color:var(--graphite); margin-bottom:8px;}
.field input{
  width:100%; font-size:16px;              /* 16px 미만이면 iOS 에서 화면이 확대됩니다 */
  padding:13px 16px; border:1px solid var(--vapor); border-radius:16px;
  background:var(--ash); color:var(--abyssal);
}
.field input:focus{outline:none; border-color:var(--slate); background:var(--bone);}
.modal__err{margin-top:var(--sp-16); font-size:14px; color:var(--abyssal); min-height:20px;}
.modal__btns{display:flex; gap:8px; margin-top:var(--sp-24);}
.modal__btns .btn{flex:1 1 0; padding:13px 18px;}

/* 편집 중인 글자 */
body.editing [data-edit]{
  outline:1px dashed var(--pebble); outline-offset:3px; border-radius:3px; cursor:text;
}
body.editing [data-edit]:hover{outline-color:var(--graphite);}
body.editing [data-edit]:focus{
  outline:2px solid var(--ember); background:rgba(235,163,112,.12);
}
body.editing{padding-bottom:96px;}

/* 하단 도구막대 */
.editbar{
  position:fixed; left:0; right:0; bottom:0; z-index:90;
  background:var(--espresso); color:var(--bone);
  padding:14px 20px; padding-bottom:calc(14px + env(safe-area-inset-bottom));
  display:flex; flex-wrap:wrap; align-items:center; gap:8px;
}
.editbar[hidden]{display:none !important;}
.editbar__msg{margin-right:auto; font-size:14px; opacity:.92; line-height:1.4;}
.editbar .btn{padding:10px 18px; font-size:14px;}
/* 어두운 막대 위에서는 채움 버튼의 색을 뒤집습니다 */
.editbar .btn--fill{background:var(--bone); color:var(--espresso);}

/* ===========================================================================
   ANIMAL CROSSING LAYER — 마을 게시판 느낌
   둥근 모서리 + 두꺼운 테두리 + 아래로 떨어지는 '스티커 그림자' 가 핵심입니다.
   =========================================================================== */

/* 바탕: 모래빛 + 아주 옅은 점무늬 */
body{
  background-color:var(--canvas);
  background-image:radial-gradient(circle at 10px 10px, rgba(150,138,118,.06) 2px, transparent 2px);
  background-size:22px 22px;
}

/* ---------- 섹션 = 게시판 카드 ---------- */
.section{
  background:var(--bone);
  border:2px solid var(--mist);
  border-radius:32px;
  padding:var(--sp-40);
  margin-top:var(--sp-32);
  box-shadow:0 5px 0 var(--shadow);
}
.section + .section{
  border-top:2px solid var(--mist);   /* 헤어라인 대신 카드 테두리로 */
  margin-top:var(--sp-32);
  padding-top:var(--sp-40);
}

/* 소제목 + 두루마리 아이콘 */
.h-section{display:flex; align-items:center; gap:12px;}
.sec-ico{
  position:relative; flex:none;
  width:44px; height:44px; line-height:0;
}
.sec-ico img, .sec-ico svg{
  position:absolute; top:0; left:0; width:100%; height:100%;
  image-rendering:pixelated;                 /* 픽셀 그림이 뭉개지지 않도록 */
  image-rendering:-moz-crisp-edges;
  image-rendering:crisp-edges;
}
.sec-ico img{z-index:2;}                     /* 실제 PNG 가 있으면 그게 위로 */
.sec-ico svg{z-index:1;}
.sec-ico.has-img svg{display:none;}          /* PNG 가 떴으면 대체 그림은 숨김 */

/* 라벨 앞의 작은 나뭇잎 */
.eyebrow{display:inline-flex; align-items:center; gap:8px;}
.eyebrow::before{
  content:""; width:20px; height:20px; flex:none;
  background:url("images/leaf-icon.png") center / contain no-repeat;
}

/* ---------- 대표 프로젝트: 그림이 들어간 블럭형 박스 ---------- */
.pjbox{
  display:block; width:100%; text-align:left;
  background:var(--bone); border:2px solid var(--mist);
  border-radius:var(--r-card); overflow:hidden;
  box-shadow:0 5px 0 var(--shadow);
  transition:transform .16s ease, box-shadow .16s ease;
  cursor:pointer;
}
.pjbox:hover{transform:translateY(-3px); box-shadow:0 8px 0 var(--shadow);}
.pjbox:active{transform:translateY(2px); box-shadow:0 2px 0 var(--shadow);}
.pjbox__img{display:block; width:100%; height:auto; background:var(--ash);}
/* 그림이 없을 때: 따뜻한 그라데이션 + 제목 (포트폴리오 준비 중 박스용) */
.pjbox__ph{
  display:flex; align-items:center; justify-content:center; text-align:center;
  aspect-ratio:5/3; padding:24px;
  background:var(--gradient-warm);
  font-size:26px; font-weight:700; letter-spacing:-.02em; color:#fffdfa;
  text-shadow:0 1px 6px rgba(90,70,50,.35);
}
@supports not (aspect-ratio:1/1){ .pjbox__ph{height:0; padding-bottom:60%;} }
.pjbox__foot{padding:var(--sp-24) var(--sp-32) var(--sp-32);}
.pjbox__desc{
  font-size:20px; font-weight:700; line-height:1.4; letter-spacing:-.02em;
  color:var(--obsidian);
}
.pjbox__more{
  display:inline-flex; align-items:center; gap:6px;
  margin-top:14px; font-size:14px; color:var(--slate);
}
.pjbox__more::after{content:"→";}

/* ---------- 프로젝트 소개 창 ---------- */
.pjmodal{
  position:fixed; top:0; left:0; right:0; bottom:0; z-index:110;
  display:flex; align-items:center; justify-content:center; padding:24px;
  background:rgba(60,50,40,.42);
  -webkit-backdrop-filter:blur(8px); backdrop-filter:blur(8px);
}
.pjmodal[hidden]{display:none !important;}
.pjmodal__box{
  width:100%; max-width:920px; max-height:86vh; max-height:86dvh;
  display:flex; flex-direction:column;
  background:var(--bone); border:3px solid var(--mist); border-radius:32px;
  box-shadow:0 8px 0 var(--shadow); overflow:hidden;
}
.pjmodal__bar{
  display:flex; align-items:center; gap:var(--sp-16);
  padding:20px var(--sp-32); border-bottom:2px solid var(--mist);
  background:var(--ash);
}
.pjmodal__title{font-size:22px; font-weight:700; letter-spacing:-.02em; margin-right:auto;}
.pjmodal__close{
  width:38px; height:38px; flex:none; border-radius:var(--r-pill);
  border:2px solid var(--mist); background:var(--bone); color:var(--slate);
  font-size:16px; line-height:1;
}
.pjmodal__close:hover{background:var(--ash);}

.pjmodal__main{display:flex; min-height:0; flex:1;}

/* 좌측 목차 */
.pjmodal__toc{
  flex:none; width:210px; padding:var(--sp-24) var(--sp-16);
  border-right:2px dashed var(--mist); overflow-y:auto;
  -webkit-overflow-scrolling:touch;
}
.pjtoc{
  display:block; width:100%; text-align:left;
  padding:12px 16px; margin-bottom:6px; border-radius:16px;
  font-size:15px; color:var(--slate); line-height:1.4;
  transition:background .16s ease, color .16s ease;
}
.pjtoc:hover{background:var(--ash);}
.pjtoc[aria-selected="true"]{background:var(--leaf); color:#fffdfa; font-weight:700;}

/* 우측 내용 */
.pjmodal__content{
  flex:1; min-width:0; padding:var(--sp-32) var(--sp-40);
  overflow-y:auto; -webkit-overflow-scrolling:touch;
}
.pjpage__title{font-size:26px; font-weight:700; letter-spacing:-.02em; margin-bottom:var(--sp-24);}
.pjpage__body > *{margin-bottom:var(--sp-24);}
.pjpage__body > *:last-child{margin-bottom:0;}
.pjpage__body p{font-size:16px; line-height:1.9; color:var(--abyssal); max-width:64ch;}

/* 영상 (유튜브) */
.pjvideo{
  position:relative; width:100%; aspect-ratio:16/9;
  border-radius:16px; overflow:hidden; background:#000; border:2px solid var(--mist);
}
@supports not (aspect-ratio:1/1){ .pjvideo{height:0; padding-bottom:56.25%;} }
.pjvideo iframe{position:absolute; top:0; left:0; width:100%; height:100%; border:0;}
/* 썸네일 + 재생 버튼 */
.pjvideo__play{
  position:absolute; top:0; left:0; width:100%; height:100%;
  background-size:cover; background-position:center; cursor:pointer;
  display:flex; align-items:center; justify-content:center;
}
.pjvideo__btn{
  width:68px; height:48px; border-radius:14px;
  background:rgba(20,19,18,.72);
  transition:background .16s ease, transform .16s ease;
  position:relative;
}
.pjvideo__btn::after{
  content:""; position:absolute; top:50%; left:50%;
  transform:translate(-40%,-50%);
  border-style:solid; border-width:11px 0 11px 18px;
  border-color:transparent transparent transparent #fff;
}
.pjvideo__play:hover .pjvideo__btn{background:#e03a3a; transform:scale(1.06);}
.pjvideo__link{margin-top:-14px; font-size:14px;}
.pjvideo__link a{
  color:var(--slate); border-bottom:1px solid var(--vapor); padding-bottom:1px;
}
.pjvideo__link a:hover{color:var(--abyssal);}

/* 그림 */
.pjfig{margin:0;}
.pjfig img{
  width:100%; height:auto; display:block;
  border:2px solid var(--mist); border-radius:14px; background:#fff;
}
.pjfig figcaption{display:none; margin-top:8px; font-size:13px; color:var(--graphite);}
.pjfig.is-missing{
  border:2px dashed var(--vapor); border-radius:14px; padding:24px; text-align:center; background:var(--ash);
}
.pjfig.is-missing figcaption{display:block; margin:0;}

/* 링크 버튼 */
.pjlinks{display:flex; flex-wrap:wrap; gap:10px;}
.pjlink{
  display:inline-flex; align-items:center; gap:7px;
  padding:12px 20px; border-radius:var(--r-pill);
  background:var(--leaf); color:#fffdfa; font-size:15px; font-weight:700;
  box-shadow:0 4px 0 var(--leaf-dark);
  transition:transform .12s ease, box-shadow .12s ease;
}
.pjlink:hover{transform:translateY(-2px); box-shadow:0 6px 0 var(--leaf-dark);}
.pjlink:active{transform:translateY(3px); box-shadow:none;}
.pjpage__body .hl{
  font-weight:700; color:var(--obsidian);
  background:linear-gradient(transparent 58%, rgba(230,164,110,.42) 58%);
  padding:0 2px; border-radius:2px;
}
.pjpage__empty{
  border:2px dashed var(--vapor); border-radius:var(--r-card);
  padding:var(--sp-48) var(--sp-32); color:var(--graphite); font-size:15px; line-height:1.7;
}
.pjpage__empty b{display:block; font-size:17px; color:var(--abyssal); margin-bottom:8px; font-weight:700;}
.pjpage__empty code{
  font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; font-size:13px;
  background:var(--ash); padding:2px 6px; border-radius:6px; color:var(--abyssal);
}

body.pj-open{overflow:hidden;}

/* 편집 중: 안내 상자는 숨기고, 빈 본문도 눌러서 입력할 수 있게 */
body.editing .pjpage__empty{display:none;}
body.editing .pjpage__body{min-height:150px;}
body.editing .pjpage__body p:only-child:empty::before{
  content:"여기에 내용을 입력하세요"; color:var(--fog);
}

/* ---------- 이력서: 좌우 2단 배치 ----------
 * 좌측 = 개인 신상정보 / 학력·경력 / 자격증
 * 우측 = 프로젝트 / 기술 스택 / 기타사항
 * 화면이 좁아지면(900px 이하) 자동으로 한 줄로 쌓입니다.
 */
.rescols{
  display:grid; grid-template-columns:1fr 1fr;
  gap:var(--sp-24); align-items:start; margin-top:var(--sp-32);
}
.rescol{display:flex; flex-direction:column; gap:var(--sp-24);}
.rescol .section{margin-top:0; padding-top:var(--sp-40); border-top-width:2px;}
/* 반쪽 폭이라 안쪽 카드들은 한 줄로 */
.rescol .cards, .rescol .extras{grid-template-columns:1fr;}
.rescol .card, .rescol .extra{padding:var(--sp-32) var(--sp-24);}
.rescol .cert{grid-template-columns:110px 1fr auto;}

/* ---------- 구분선은 점선으로 (게시판 느낌) ---------- */
.rows, .tl, .tour{border-top:2px dashed var(--mist);}
.row, .tl__item, .cert, .tour__row{border-bottom:2px dashed var(--mist);}
.essay{border-top:2px dashed var(--mist);}
.essay__item{border-bottom:2px dashed var(--mist);}
.card__points{border-top:2px dashed var(--vapor);}

/* ---------- 카드류: 둥글게 + 스티커 그림자 ---------- */
.card, .step, .extra, .mproj__card, .pf__card{
  background:var(--ash);
  border:2px solid var(--mist);
  border-radius:var(--r-card);
  box-shadow:0 4px 0 var(--shadow);
}
.empty{border:2px dashed var(--vapor); background:var(--ash);}

/* ---------- 배지 = 동글동글한 알약 ---------- */
.badge{
  background:#f8efe6; color:#a9673d;
  border:2px solid #eddccb; border-radius:var(--r-pill);
  padding:5px 13px;
}
.badge--line{background:var(--bone); border-color:var(--mist); color:var(--slate);}
.card__tags .badge, .pf__tags .badge{background:var(--bone); border-color:var(--mist); color:var(--slate);}

/* ---------- 버튼 ---------- */
.btn{border-radius:var(--r-pill);}
.btn--fill{background:var(--leaf); color:#fffdf5; box-shadow:0 4px 0 var(--leaf-dark);}
.btn--ghost{
  background:var(--bone); border:2px solid var(--mist); color:var(--abyssal);
  box-shadow:0 4px 0 var(--shadow);
}
.btn--onDark{border:2px solid rgba(255,250,240,.55); color:#fffdf5;}
.btn:active{transform:translateY(3px); box-shadow:none; opacity:1;}

/* ---------- 프로필 사진 액자 ---------- */
.photo{border:3px solid var(--mist); box-shadow:0 5px 0 var(--shadow);}

/* ---------- 하단 배너 = 나무 게시판 ---------- */
.cta{
  background:var(--wood); color:#fffcf7;
  border:3px solid var(--wood-dark);
  border-radius:36px;
  box-shadow:0 6px 0 rgba(135,117,101,.35);
  position:relative;
}
.cta::after{                       /* 안쪽 점선 = 공지 종이 느낌 */
  content:""; position:absolute; top:14px; right:14px; bottom:14px; left:14px;
  border:2px dashed rgba(255,252,247,.30); border-radius:26px; pointer-events:none;
}
.cta .btn--fill{background:#fffcf7; color:var(--wood); box-shadow:0 4px 0 rgba(135,117,101,.4);}

/* ---------- 편집 도구막대 ---------- */
.editbar{background:var(--wood); border-top:3px solid var(--wood-dark);}
.editbar .btn--fill{background:#fffcf7; color:var(--wood); box-shadow:0 3px 0 rgba(135,117,101,.4);}

/* ---------- 로그인 창 ---------- */
.modal__box{border:3px solid var(--mist); box-shadow:0 6px 0 var(--shadow); border-radius:32px;}
.field input{border:2px solid var(--mist); border-radius:18px; background:var(--ash);}
.field input:focus{border-color:var(--leaf); background:var(--bone);}

/* 편집 중 표시도 따뜻하게 */
body.editing [data-edit]{outline:2px dashed var(--pebble);}
body.editing [data-edit]:focus{outline:2px solid var(--leaf); background:rgba(217,139,95,.13);}

/* ===========================================================================
   반응형 — 태블릿
   =========================================================================== */
@media (max-width:900px){
  :root{--pad-x:24px; --section-gap:56px; --r-card:32px; --r-hero:60px;}
  .hero{grid-template-columns:1fr; gap:var(--sp-32);}
  .photo{max-width:260px; aspect-ratio:1/1;}
  .hero__tagline{font-size:30px;}
  .cards,.extras,.pf,.mproj{grid-template-columns:1fr;}
  .rescols{grid-template-columns:1fr;}
  .steps{grid-template-columns:repeat(2,1fr);}
  .essay__item{padding:var(--sp-40) 0;}
  .essay__title{font-size:30px;}
  .tl__item{grid-template-columns:1fr; gap:6px;}
  .tl__period{font-size:14px;}
  .cta{padding:var(--sp-48) var(--sp-32);}
  .cta__heading{font-size:26px;}
}

/* ===========================================================================
   반응형 — 모바일 (iPhone 포함)
   =========================================================================== */
@media (max-width:640px){
  :root{--pad-x:20px; --section-gap:48px; --r-card:28px; --r-hero:44px;}
  .page{padding-top:var(--sp-40); padding-bottom:var(--sp-64);}
  .steps{grid-template-columns:1fr;}
  .step{padding:var(--sp-24);}
  .tour__row{grid-template-columns:1fr auto; gap:4px 12px; padding:16px 0;}
  .tour__period{grid-column:1 / -1; font-size:13px;}
  .mproj__card{padding:var(--sp-32) var(--sp-24);}
  .pjbox__foot{padding:var(--sp-16) var(--sp-24) var(--sp-24);}
  .pjbox__desc{font-size:17px;}
  .pjmodal{padding:12px;}
  .pjmodal__box{max-height:92vh; max-height:92dvh; border-radius:24px;}
  .pjmodal__bar{padding:16px var(--sp-24);}
  .pjmodal__title{font-size:19px;}
  .pjmodal__main{flex-direction:column;}
  .pjmodal__toc{
    width:100%; display:flex; gap:6px; padding:12px var(--sp-16);
    border-right:0; border-bottom:2px dashed var(--mist);
    overflow-x:auto; overflow-y:visible;
  }
  /* 가로 탭이므로 글자 길이만큼만 차지하게 (기본값 width:100% 를 되돌립니다) */
  .pjtoc{width:auto; flex:0 0 auto; margin-bottom:0; padding:10px 14px; font-size:14px; white-space:nowrap;}
  .pjmodal__content{padding:var(--sp-24);}
  .pjpage__title{font-size:22px;}
  .mproj__title{font-size:24px;}
  .photo{max-width:100%;}
  .hero__tagline{font-size:26px; letter-spacing:-.02em;}
  .h-section{font-size:26px;}
  .sec-ico{width:33px; height:33px;}
  .row{grid-template-columns:1fr; gap:4px; padding:14px 0;}
  .row dt{font-size:13px;}
  .card{padding:var(--sp-32) var(--sp-24);}
  .card__title{font-size:21px;}
  .extra{padding:var(--sp-32) var(--sp-24);}
  .cert, .rescol .cert{grid-template-columns:1fr; gap:4px;}   /* 2단용 규칙보다 뒤에 와야 이깁니다 */
  .cert__issuer{text-align:left;}
  .essay__title{font-size:26px;}
  .essay__body p{line-height:1.85;}
  .pf__body{padding:var(--sp-24);}
  .empty{padding:var(--sp-40) var(--sp-24);}
  .cta{border-radius:32px; padding:var(--sp-40) var(--sp-24);}
  .cta__btns .btn{flex:1 1 auto;}
  .editbar{padding:12px 16px; padding-bottom:calc(12px + env(safe-area-inset-bottom));}
  .editbar__msg{flex-basis:100%; margin-right:0; margin-bottom:2px; font-size:13px;}
  .editbar .btn{flex:1 1 0; padding:11px 12px; font-size:13.5px;}
  body.editing{padding-bottom:150px;}
}

/* 아주 좁은 화면 (iPhone SE 등) */
@media (max-width:360px){
  .hero__tagline{font-size:23px;}
}

/* 모션 최소화 설정 존중 */
@media (prefers-reduced-motion:reduce){
  html{scroll-behavior:auto;}
  *{transition:none !important; animation:none !important;}
}
</style>
<!-- 포스트잇 · 안내 문구용 손글씨 글꼴 (불러오지 못하면 Pretendard 로 표시됩니다) -->
<link rel="preconnect" href="https://fonts.googleapis.com">

</head>

    <div class="room" id="iv-room">
      <div class="floor"></div>
      <div class="door__light" id="iv-light"></div>

      <!-- 문: 문 전체가 버튼입니다 -->
      <button class="door" id="iv-door" type="button">
        <span class="door__hole" id="iv-hole"></span>

          <span class="door__face">

            <span class="door__inset door__inset--bot"></span>
            <span class="door__knob"></span>
          </span>
          <span class="door__face door__face--back">
            <span class="door__inset door__inset--top"></span>
            <span class="door__inset door__inset--bot"></span>
            <span class="door__knob"></span>
          </span>

      <p class="hint" id="iv-hint"><span class="hint__box" id="iv-hintText"></span></p>

      <div class="bubble greet" id="iv-greet" role="status" aria-live="polite"><span id="iv-greetText"></span></div>

    <div class="desk" id="iv-desk">

      <div class="desk__pen"></div>
    </div>
  </div>

  <!-- 보는 사람 = 면접관 -->

  <!-- 자기소개 장면: 화면을 누르면 진행합니다 -->
  <button class="tap" id="iv-tap" type="button" aria-label="다음 문단 보기"></button>
  <section class="bubble speech" id="iv-speech" aria-label="자기소개서">
    <div class="speech__meta">
      <span class="speech__no" id="iv-speechNo"></span>
      <span class="speech__dots" id="iv-speechDots" aria-hidden="true"></span>
    </div>
    <h2 class="speech__title" id="iv-speechTitle"></h2>
    <div class="speech__body" id="iv-speechBody" aria-live="polite"></div>

      <button class="speech__prev" id="iv-speechPrev" type="button">이전</button>
      <span class="speech__hint" id="iv-speechHint"></span>

  <nav class="scenebtns" id="iv-sceneBtns" aria-label="다른 문서 보기">

    <button class="note note--portfolio" type="button" data-doc="portfolio">포트폴리오</button>

  <!-- 또렷하게 보이는 층: 이력서 / 자기소개서 / 포트폴리오 -->
  <main class="viewer" id="iv-viewer" data-doc="resume">
    <div class="deck">

<div class="editbar" id="editBar" hidden>

<!-- 내용은 전부 data.js 에 있습니다. -->
<script src="data.js"></script>
<script src="interview.js"></script>
<script>
(function () {
  "use strict";

  /* =========================================================================
     도우미
     ========================================================================= */
  var STAR = String.fromCharCode(42);   /* 별표 문자 */
  /* 빈 줄로 문단을 나누는 규칙 */
  var SPLIT_RE = new RegExp(String.fromCharCode(92) + "n{2,}");
  var esc = function (s) {
    return String(s == null ? "" : s)
      .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;").replace(/'/g, "&#39;");
  };
  var br = function (s) { return esc(s).replace(/\n/g, "<br>"); };
  /* data.js 에서 **문장** 으로 감싼 부분을 굵게 + 형광펜 처리합니다 */
  var HL_RE = new RegExp("\\*\\*([^*]+)\\*\\*", "g");
  var mark = function (s) {
    return br(s).replace(HL_RE, '<strong class="hl">$1</strong>');
  };

  /* =========================================================================
     프로젝트 소개 창의 본문 렌더러 — 글 + 영상 + 이미지 + 링크
     본문 한 줄(문단)이 아래 표시로 시작하면 특별 블록이 됩니다.
       @video <유튜브 주소>          → 영상 재생 창
       @image <이미지 경로>          → 그림
       @link  <주소> | <버튼 글자>   → 눌러서 이동하는 버튼 (여러 줄 나열 가능)
     나머지는 일반 문단이며 **문장** 으로 감싸면 강조됩니다.
     ========================================================================= */
  function ytId(u) {
    var m = String(u).match(/(?:v=|youtu\.be\/|embed\/|shorts\/)([\w-]{11})/);
    if (m) { return m[1]; }
    return /^[\w-]{11}$/.test(String(u).trim()) ? String(u).trim() : "";
  }
  function videoBlock(u) {
    var id = ytId(u);
    if (!id) { return '<p>' + esc(u) + '</p>'; }
    var watch = "https://www.youtube.com/watch?v=" + id;
    var thumb = "https://i.ytimg.com/vi/" + id + "/hqdefault.jpg";
    /* 처음에는 썸네일만 보여주고(=오류 안 남), 누르면 그 자리에서 바로 영상을 재생합니다. */
    return '<div class="pjvideo" data-yt="' + id + '">' +
        '<button class="pjvideo__play" type="button" aria-label="소개 영상 재생" ' +
        'style="background-image:url(\'' + thumb + '\')">' +
          '<span class="pjvideo__btn" aria-hidden="true"></span>' +
        '</button>' +
      '</div>' +
      '<p class="pjvideo__link"><a href="' + watch + '" target="_blank" rel="noopener">' +
      '유튜브에서 보기 <span aria-hidden="true">↗</span></a></p>';
  }
  function imageBlock(path) {
    return '<figure class="pjfig"><img src="' + esc(path) + '" alt="" loading="lazy" ' +
      'onerror="this.style.display=\'none\'; this.parentNode.classList.add(\'is-missing\');">' +
      '<figcaption>이미지를 불러오지 못했습니다 — ' + esc(path) + '</figcaption></figure>';
  }
  function linkBlock(lines) {
    var html = lines.map(function (line) {
      var m = line.match(/^@link\s+(\S+)\s*(?:\|\s*(.+))?$/i);
      if (!m) { return ""; }
      return '<a class="pjlink" href="' + esc(m[1]) + '" target="_blank" rel="noopener">' +
        esc((m[2] || m[1]).trim()) + '<span aria-hidden="true">↗</span></a>';
    }).join("");
    return '<div class="pjlinks">' + html + '</div>';
  }
  function renderBody(text) {
    var blocks = String(text == null ? "" : text)
      .replace(/\r\n?/g, "\n").split(/\n{2,}/);
    return blocks.map(function (blk) {
      var t = blk.replace(/^\n+|\n+$/g, "");
      if (!t.trim()) { return ""; }
      var head = t.trim();
      if (/^@video\s+/i.test(head)) { return videoBlock(head.replace(/^@video\s+/i, "").trim()); }
      if (/^@image\s+/i.test(head)) { return imageBlock(head.replace(/^@image\s+/i, "").trim()); }
      if (/^@link\s+/i.test(head)) {
        return linkBlock(t.split(/\n/).filter(function (l) { return /^@link\s+/i.test(l.trim()); })
          .map(function (l) { return l.trim(); }));
      }
      return '<p>' + mark(t) + '</p>';
    }).join("");
  }
  /* 편집 모드에서는 위 표시들을 '글자 그대로' 고칠 수 있게 원본을 문단별로 보여줍니다 */
  function rawBody(text) {
    var t = String(text == null ? "" : text).trim();
    if (!t) { return '<p></p>'; }
    return t.replace(/\r\n?/g, "\n").split(/\n{2,}/).map(function (b) {
      return '<p>' + br(b.replace(/^\n+|\n+$/g, "")) + '</p>';
    }).join("");
  }

  /* 큰 제목용: 넓은 화면에서는 줄바꿈, 모바일에서는 이어 붙임 */
  var lines = function (s) {
    return String(s == null ? "" : s).split(/\n/).map(function (t) {
      return '<span class="ln">' + esc(t) + '</span>';
    }).join("");
  };
  var has = function (a) { return Array.isArray(a) && a.length > 0; };
  var el  = function (id) { return document.getElementById(id); };

  /* 편집 표시: 요소에 붙일 data-edit 속성을 만들어 줍니다 */
  var E  = function (path) { return ' data-edit="' + esc(path) + '"'; };
  var EM = function (path) { return ' data-edit="' + esc(path) + '" data-multiline="1"'; };
  var EL = function (path) { return ' data-edit="' + esc(path) + '" data-lines="1"'; };
  var NL = String.fromCharCode(10);   /* 줄바꿈 문자 */

  if (typeof DATA === "undefined") {
    document.body.innerHTML =
      '<div style="padding:40px;font:16px/1.6 sans-serif">' +
      'data.js 를 불러오지 못했습니다. index.html 과 같은 폴더에 data.js 가 있는지 확인해 주세요.</div>';
    return;
  }

  /* =========================================================================
     이 브라우저에 저장된 수정본 불러오기
     ========================================================================= */
  var STORE_KEY = "yhs_portfolio_data_v1";
  var D = DATA;
  var usingOverride = false;  /* 저장본을 불러왔는지 여부 (내부 표시용) */

  try {
    var saved = window.localStorage.getItem(STORE_KEY);
    if (saved) {
      var parsed = JSON.parse(saved);
      Object.keys(parsed).forEach(function (k) { D[k] = parsed[k]; });
      usingOverride = true;
    }
  } catch (e) { /* 시크릿 모드 등에서는 그냥 원래 파일을 씁니다 */ }

  /* '저장 초기화' 버튼은 이 브라우저에 저장된 수정본이 있을 때만 편집 도구막대에 보입니다.
     (평소에는 아무 안내도 뜨지 않습니다) */
  function refreshResetBtn() {
    var has = false;
    try { has = !!window.localStorage.getItem(STORE_KEY); } catch (e) {}
    var b = el("resetBtn");
    if (b) { b.hidden = !has; }
  }

  el("resetBtn").addEventListener("click", function () {
    if (!window.confirm("이 브라우저에 저장한 수정본을 지우고 원래 data.js 내용으로 되돌립니다.")) { return; }
    try { window.localStorage.removeItem(STORE_KEY); } catch (e) {}
    window.location.reload();
  });

  /* =========================================================================
     문서 제목 / 브랜드
     ========================================================================= */
  document.title = (D.site.name || "") + (D.site.role ? " · " + D.site.role : "");

  /* =========================================================================
     소제목 왼쪽에 붙는 픽셀 두루마리 아이콘
     ---------------------------------------------------------------------
     한 칸이 곧 한 픽셀입니다. 아래 GRID 의 글자를 바꾸면 그림이 바뀝니다.
       .=투명  o=테두리  b/h=나무 롤  p/w=종이  y/G=금색  r/R=리본  s/S=반짝임
     images/section-icon.png 파일을 넣어두면 그 그림이 대신 쓰입니다.
     ========================================================================= */
  var ICON_COLORS = {
    o: "#6b4526", b: "#a9724a", h: "#c99468",
    p: "#f7efdc", w: "#fffdf5",
    y: "#ffe08a", G: "#f0b429",
    r: "#e03a3a", R: "#a82424",
    s: "#ffd75e", S: "#fff4c2"
  };
  var ICON_GRID = [
    "..................",
    ".s................",
    "sSs...............",
    ".s................",
    "....oooooooooo....",
    "....obbbbbbbho....",
    "....ohhhhhhhbo....",
    "....oppppppppo....",
    "....owpyGGpppo....",
    "....owpyGGpppo....",
    "....owpyGGpppo....",
    "....owpyGGppporR..",
    "....owppppppporrR.",
    "....owppyGppporrR.",
    "....owppppppporR..",
    "....obbbbbbbhoR...",
    "....ohhhhhhhbo....",
    "....oooooooooo...."
  ];

  var iconSVGCache = null;
  function scrollIcon() {
    if (iconSVGCache) { return iconSVGCache; }
    var rects = "";
    for (var y = 0; y < ICON_GRID.length; y++) {
      var row = ICON_GRID[y];
      for (var x = 0; x < row.length; x++) {
        var c = ICON_COLORS[row.charAt(x)];
        if (!c) { continue; }
        rects += '<rect x="' + x + '" y="' + y + '" width="1" height="1" fill="' + c + '"/>';
      }
    }
    iconSVGCache =
      '<span class="sec-ico" aria-hidden="true">' +
        '<img src="images/section-icon.png" alt="">' +
        '<svg viewBox="0 0 18 18" shape-rendering="crispEdges" focusable="false">' +
          rects +
        '</svg>' +
      '</span>';
    return iconSVGCache;
  }

  /* 섹션 껍데기 (icon 을 true 로 주면 소제목 왼쪽에 두루마리가 붙습니다) */
  function section(eyebrow, title, inner, lede, icon) {
    return '<section class="section">' +
      '<p class="eyebrow">' + esc(eyebrow) + '</p>' +
      '<h2 class="h-section">' +
        (icon ? scrollIcon() : '') +
        '<span>' + esc(title) + '</span>' +
      '</h2>' +
      (lede ? '<p class="lede">' + br(lede) + '</p>' : '') +
      inner +
    '</section>';
  }

  /* 그림이 들어간 '블럭형 박스' (대표 프로젝트 / 포트폴리오 공용)
   * item : { title, desc/summary, cover, detail }
   * base : "mainProjects.0" 또는 "portfolio.0" (편집·팝업 경로의 뿌리)
   * descKey : 박스 아래 문구가 담긴 필드 이름 ("desc" 또는 "summary")
   */
  function blockBox(item, base, descKey) {
    var clickable = has(item.detail);
    var desc = item[descKey] || item.desc || item.summary || "";
    var tag = clickable ? "button" : "div";
    return '<' + tag + ' class="pjbox"' +
      (clickable ? ' type="button" data-project="' + esc(base) + '"' +
                   ' aria-label="' + esc(item.title) + ' 자세히 보기"' : '') + '>' +
      (item.cover
        ? '<img class="pjbox__img" src="' + esc(item.cover) + '" alt="' + esc(item.title) + '">'
        : '<span class="pjbox__ph" aria-hidden="true">' + esc(item.title || "") + '</span>') +
      '<div class="pjbox__foot">' +
        '<p class="pjbox__desc"' + E(base + "." + descKey) + '>' + esc(desc) + '</p>' +
        (clickable ? '<span class="pjbox__more">자세히 보기</span>' : '') +
      '</div>' +
    '</' + tag + '>';
  }

  /* =========================================================================
     이력서
     ========================================================================= */
  function renderResume() {
    var p = D.profile || {};
    var html = "";
    /* 좌측 칸: 개인 신상정보 → 학력·경력 → 자격증 → 기술 스택 → 기타사항
       우측 칸: 프로젝트
       (화면이 좁아지면 자동으로 한 줄로 쌓입니다) */
    var left = "", right = "";

    /* 프로필 사진 + 한 줄 소개 */
    var initial = (p.name || "").slice(-2);
    html +=
      '<div class="hero">' +
        '<div class="photo">' +
          '<div class="photo__ph"><b>' + esc(initial) + '</b></div>' +
          (p.photo ? '<img src="' + esc(p.photo) + '" alt="' + esc(p.name) + ' 프로필 사진" ' +
                     'onerror="this.remove()">' : '') +
        '</div>' +
        '<div>' +
          '<p class="hero__name"' + E("profile.name") + '>' + esc(p.name || "") + '</p>' +
          '<h1 class="hero__tagline"' + EL("profile.tagline") + '>' +
            lines(p.tagline || "") + '</h1>' +
          (has(p.keywords)
            ? '<div class="keys">' + p.keywords.map(function (k, i) {
                return '<span class="badge"' + E("profile.keywords." + i) + '>' +
                       esc(k) + '</span>'; }).join("") + '</div>'
            : '') +
        '</div>' +
      '</div>';

    /* 개인 신상정보 — 좌측 */
    if (has(D.personal)) {
      left += section("Personal", "개인 신상정보",
        '<dl class="rows">' + D.personal.map(function (r, i) {
          var v = r.link
            ? '<a href="' + esc(r.link) + '"' + E("personal." + i + ".value") + '>' +
              esc(r.value) + '</a>'
            : '<span' + E("personal." + i + ".value") + '>' + esc(r.value) + '</span>';
          return '<div class="row"><dt' + E("personal." + i + ".label") + '>' +
                 esc(r.label) + '</dt><dd>' + v + '</dd></div>';
        }).join("") + '</dl>');
    }

    /* 학력 · 경력 — 좌측 */
    if (has(D.history)) {
      left += section("History", "학력 · 경력",
        '<div style="margin-top:32px">' + D.history.map(function (g, gi) {
          return '<div class="group">' +
            '<p class="group__title"' + E("history." + gi + ".group") + '>' + esc(g.group) + '</p>' +
            '<div class="tl">' + (g.items || []).map(function (i, ii) {
              var base = "history." + gi + ".items." + ii;
              return '<div class="tl__item">' +
                '<div class="tl__period"' + E(base + ".period") + '>' + esc(i.period) + '</div>' +
                '<div><div class="tl__title"' + E(base + ".title") + '>' + esc(i.title) + '</div>' +
                (i.desc ? '<div class="tl__desc"' + EL(base + ".desc") + '>' + br(i.desc) + '</div>' : '') +
                '</div>' +
              '</div>';
            }).join("") + '</div></div>';
        }).join("") + '</div>');
    }

    /* 자격증 — 좌측 */
    if (has(D.certificates)) {
      left += section("Certificates", "자격증",
        '<div style="margin-top:32px; border-top:1px solid var(--mist)">' +
        D.certificates.map(function (c, i) {
          return '<div class="cert">' +
            '<div class="cert__date"' + E("certificates." + i + ".date") + '>' + esc(c.date) + '</div>' +
            '<div class="cert__name"' + E("certificates." + i + ".name") + '>' + esc(c.name) + '</div>' +
            '<div class="cert__issuer"' + E("certificates." + i + ".issuer") + '>' + esc(c.issuer) + '</div>' +
          '</div>';
        }).join("") + '</div>');
    }

    /* 기술 스택 — 좌측 */
    if (has(D.skills)) {
      left  += section("Skills", "기술 스택",
        '<div class="keys" style="margin-top:32px">' + D.skills.map(function (s, i) {
          return '<span class="badge badge--line"' + E("skills." + i) + '>' +
                 esc(s) + '</span>'; }).join("") + '</div>');
    }

    /* 기타사항 — 좌측 */
    if (has(D.extras)) {
      left  += section("Etc.", "기타사항",
        '<div class="extras">' + D.extras.map(function (g, gi) {
          return '<div class="extra">' +
            '<h3 class="extra__title"' + E("extras." + gi + ".group") + '>' + esc(g.group) + '</h3>' +
            '<ul>' + (g.items || []).map(function (i, ii) {
              return '<li' + E("extras." + gi + ".items." + ii) + '>' + esc(i) + '</li>';
            }).join("") + '</ul>' +
          '</div>';
        }).join("") + '</div>');
    }

          '<code>**문장**</code> 강조 / <code>@video 주소</code> / ' +
          '<code>@image 경로</code> / <code>@link 주소 | 글자</code> 를 쓸 수 있습니다.</div>');

  /* 박스를 누르면 열기 (화면을 다시 그려도 계속 동작하도록 document 에 붙입니다) */

  /* =========================================================================
     페이지 전환
     주소에 아무것도 없으면 문부터 시작하고,
     #resume / #cover / #portfolio 로 들어오면 곧바로 그 문서를 보여줍니다.
     ========================================================================= */
  var DOCS = ["resume", "cover", "portfolio"];
  var currentDoc = "";

  function show(name, push) {
    if (pjBase) { pjClose(); }
    if (DOCS.indexOf(name) === -1) {
      currentDoc = "";
      Interview.toDoor();
      if (push && location.hash) { history.replaceState(null, "", location.pathname + location.search); }
      return;
    }
    currentDoc = name;
    Interview.toDoc(name);
    if (push && location.hash !== "#" + name) { history.replaceState(null, "", "#" + name); }
  }

  window.addEventListener("hashchange", function () {
    show(location.hash.replace("#", ""), false);
  });

  /* =========================================================================
     수정 기능
     ========================================================================= */
  var editing = false;

  /* "projects.0.points.1" 같은 경로에 값 쓰기 */
  function getByPath(obj, path) {
    var keys = path.split("."), cur = obj;
    for (var i = 0; i < keys.length; i++) {
      if (cur == null) { return null; }
      cur = cur[keys[i]];
    }
    return cur;
  }

  function setPath(obj, path, value) {
    var keys = path.split(".");
    var cur = obj;
    for (var i = 0; i < keys.length - 1; i++) {
      if (cur[keys[i]] == null) { return; }
      cur = cur[keys[i]];
    }
    cur[keys[keys.length - 1]] = value;
  }

  /* 편집 중인 요소에서 값 읽어오기
   * innerText 는 화면에 그려진 요소에서만 줄바꿈을 만들어 냅니다.
   * 숨겨진 탭의 내용도 정확히 읽어야 하므로 DOM 을 직접 훑습니다.
   */
  function inlineOf(elm) {
    var s = "";
    (function rec(n) {
      for (var i = 0; i < n.childNodes.length; i++) {
        var c = n.childNodes[i];
        if (c.nodeType === 3) { s += c.nodeValue; }
        else if (c.nodeType === 1) {
          if (c.tagName === "BR") { s += NL; }
          else if (c.className && String(c.className).indexOf("hl") > -1) {
            /* 하이라이트는 **문장** 형태로 되돌려 저장합니다 */
            s += STAR + STAR; rec(c); s += STAR + STAR;
          }
          else { rec(c); }
        }
      }
    })(elm);
    return s;
  }

  /* 블록(문단) 단위로 잘라 배열로 돌려줍니다 */
  function blockLines(node) {
    var blocks = [], buf = [];
    function flush() {
      if (buf.length) { blocks.push(buf.join("")); buf = []; }
    }
    var kids = node.childNodes;
    for (var i = 0; i < kids.length; i++) {
      var c = kids[i];
      if (c.nodeType === 1 &&
          (c.tagName === "P" || c.tagName === "DIV" ||
           (c.classList && c.classList.contains("ln")))) {
        flush();
        blocks.push(inlineOf(c));
      } else if (c.nodeType === 3) {
        buf.push(c.nodeValue);
      } else if (c.nodeType === 1) {
        buf.push(c.tagName === "BR" ? NL : inlineOf(c));
      }
    }
    flush();
    return blocks.map(function (t) {
      return t.replace(/ /g, " ")
              .replace(/[ 	]+/g, " ")
              .split(NL).map(function (x) { return x.trim(); }).join(NL)
              .trim();
    });
  }

  function readValue(node) {
    var joiner = null;
    if (node.hasAttribute("data-lines")) { joiner = "ONE"; }
    else if (node.hasAttribute("data-multiline")) { joiner = "TWO"; }
    if (!joiner) {
      return String(node.textContent || "").replace(/\s+/g, " ").trim();
    }
    var parts = blockLines(node).filter(function (t) { return t !== ""; });
    var glue = (joiner === "ONE") ? NL : NL + NL;
    return parts.join(glue);
  }

  function markEditable(on) {
    var nodes = document.querySelectorAll("[data-edit]");
    Array.prototype.forEach.call(nodes, function (n) {
      if (on) {
        n.setAttribute("contenteditable", "true");
        n.setAttribute("spellcheck", "false");
      } else {
        n.removeAttribute("contenteditable");
        n.removeAttribute("spellcheck");
      }
    });
  }

  function setMsg(t) { el("editMsg").textContent = t; }

  /* 편집 중에는 링크를 눌러도 이동하지 않도록 (글자를 고쳐야 하니까) */
  document.addEventListener("click", function (e) {
    if (!editing || !e.target.closest) { return; }
    if (e.target.closest("a[href]") && e.target.closest("[data-edit]")) {
      e.preventDefault();
    }

  /* 글자가 바뀌면 그때그때 DATA 에 반영 */
  document.addEventListener("input", function (e) {

    var node = e.target.closest("[data-edit]");
    if (!node) { return; }
    setPath(D, node.getAttribute("data-edit"), readValue(node));
    setMsg("고치는 중… 다 되면 아래 버튼으로 저장하거나 내려받으세요.");
  });

    document.execCommand("insertText", false, text);
  });

  /* ---------- data.js 파일로 내려받기 ---------- */
  var COMMENTS = {
    site:           "0. 사이트 공통",
    intro:          "0-0. 첫 화면 연출 문구 (문 · 인사 · 면접관)",
    main:           "0-1. 메인 화면",

    tournaments:    "0-3. 메인 화면 — Game Tournament (게임 대회 이력)",
    mainProjects:   "0-4. 메인 화면 — Project (대표 프로젝트)",
    auth:           "0-5. 수정 모드 로그인 정보 (소스 보기로 노출됩니다 · 실수 방지용)",
    profile:        "1. 이력서 — 프로필 사진 + 한 줄 소개",
    personal:       "2. 이력서 — 개인 신상정보",
    history:        "3. 이력서 — 학력 · 경력",
    skills:         "4. 이력서 — 기술 스택",
    projects:       "5. 이력서 — 프로젝트",
    certificates:   "6. 이력서 — 자격증",
    extras:         "7. 이력서 — 기타사항",
    cover:          "8. 자기소개서 — 소제목 + 내용",
    portfolioIntro: "9. 포트폴리오 — 안내 문구",
    portfolio:      "9. 포트폴리오 — 카드 목록",
    contact:        "10. 맨 아래 연락처 배너"
  };

  function toJS(v, depth) {
    var pad = new Array(depth + 1).join("  ");
    if (Array.isArray(v)) {
      if (!v.length) { return "[]"; }
      return "[\n" + v.map(function (x) {
        return pad + "  " + toJS(x, depth + 1);
      }).join(",\n") + ",\n" + pad + "]";
    }
    if (v && typeof v === "object") {
      var ks = Object.keys(v);
      if (!ks.length) { return "{}"; }
      return "{\n" + ks.map(function (k) {
        var key = /^[A-Za-z_$][A-Za-z0-9_$]*$/.test(k) ? k : JSON.stringify(k);
        return pad + "  " + key + ": " + toJS(v[k], depth + 1);
      }).join(",\n") + ",\n" + pad + "}";
    }
    if (typeof v === "string") { return JSON.stringify(v); }
    return String(v);
  }

  function buildDataFile() {
    var out =
      "/* ============================================================================\n" +
      " *  data.js — 웹페이지의 '수정' 기능으로 내려받은 파일입니다.\n" +
      " *  저장소의 data.js 자리에 이 파일을 덮어쓰면 모두에게 반영됩니다.\n" +
      " *  (원본에 있던 상세 설명 주석은 이 과정에서 사라집니다)\n" +
      " *\n" +
      " *  내려받은 시각: " + new Date().toLocaleString("ko-KR") + "\n" +
      " *  ========================================================================== */\n\n" +
      "const DATA = {\n";
    Object.keys(D).forEach(function (k) {
      out += "\n  /* ======================================================================\n" +
             "   *  " + (COMMENTS[k] || k) + "\n" +
             "   * ==================================================================== */\n" +
             "  " + k + ": " + toJS(D[k], 1) + ",\n";
    });
    out += "\n};\n";
    return out;
  }

  el("exportBtn").addEventListener("click", function () {
    try {
      var blob = new Blob([buildDataFile()], { type: "text/javascript;charset=utf-8" });
      var url = URL.createObjectURL(blob);
      var a = document.createElement("a");
      a.href = url;
      a.download = "data.js";
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      setTimeout(function () { URL.revokeObjectURL(url); }, 2000);
      setMsg("data.js 를 내려받았습니다. 저장소의 data.js 를 이 파일로 바꿔 올려주세요.");
    } catch (err) {
      setMsg("내려받기에 실패했습니다. 브라우저의 다운로드 설정을 확인해 주세요.");
    }
  });

  /* =========================================================================
     실행
     ========================================================================= */
  renderAll();

  /* 태블릿 상단 시계 */
  (function tick() {
    var now = new Date();
    var mm = String(now.getMinutes());
    el("iv-clock").textContent = now.getHours() + ":" + (mm.length < 2 ? "0" + mm : mm);
    setTimeout(tick, 20000);
  })();

  Interview.init({
    intro: D.intro,
    isEditing: function () { return editing; },
    /* 자기소개 말풍선에 들어갈 내용: 소제목 + 문단(빈 줄로 나뉜 단위) */
    getCover: function () {
      return (has(D.cover) ? D.cover : []).map(function (c) {
        return {
          title: c.title,
          paras: String(c.body || "").split(/\n{2,}/)
            .filter(function (t) { return t.trim(); })
            .map(function (t) { return mark(t); })
        };
      }).filter(function (c) { return c.paras.length; });
    },
    onDoc: function (name) { show(name, true); },
    onDoor: function () { show("", true); },
    onReady: function () { if (editing) { markEditable(true); } }
  });
  show(location.hash.replace("#", ""), false);
})();
</script>
</body>
</html>
